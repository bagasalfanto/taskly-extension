<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taskly</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="topbar">
        <div>
          <h1>Taskly</h1>
          <p id="sourceLabel">Siap menangkap task.</p>
        </div>
        <button id="dashboardButton" class="icon-button" type="button" title="Buka dashboard" aria-label="Buka dashboard">Dashboard</button>
      </header>

      <form id="taskForm" class="capture-form">
        <label class="field">
          <span>Task</span>
          <input id="titleInput" type="text" maxlength="120" placeholder="Tulis task cepat..." autocomplete="off">
        </label>

        <label class="field">
          <span>Catatan</span>
          <textarea id="notesInput" rows="2" placeholder="Opsional"></textarea>
        </label>

        <div class="form-grid">
          <label class="field">
            <span>Deadline</span>
            <input id="dueDateInput" type="date">
          </label>

          <label class="field">
            <span>Prioritas</span>
            <select id="priorityInput">
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </label>
        </div>

        <button class="primary-button" type="submit">Simpan Task</button>
        <p id="message" class="message" role="status"></p>
      </form>

      <section class="task-section" aria-labelledby="activeTitle">
        <div class="section-head">
          <h2 id="activeTitle">Task Aktif</h2>
          <span id="taskCount">0 task</span>
        </div>
        <div id="taskList" class="task-list"></div>
      </section>
    </main>

    <template id="taskTemplate">
      <article class="task-item">
        <div class="task-main">
          <button class="done-button" type="button" title="Tandai selesai" aria-label="Tandai selesai">OK</button>
          <div class="task-copy">
            <h3></h3>
            <p class="task-meta"></p>
          </div>
        </div>
        <div class="task-actions">
          <button class="open-button" type="button">Buka</button>
          <button class="delete-button" type="button">Hapus</button>
        </div>
      </article>
    </template>

    <script src="rnotes-utils.js"></script>
    <script src="rnotes-store.js"></script>
    <script src="rnotes-export.js"></script>
    <script src="rnotes-pdf-export.js"></script>
    <script src="theme.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
